<section id="change-password" class="screen">
  <header class="page-header">
    <h1 class="page-title">CogPsych Concepts:<br />Login/Registration</h1>
    <p class="page-subtitle">Log in to see the design concepts utilized by this GUI!</p>
  </header>

  <form id="change-password-form" class="card" novalidate>
    <h2 class="card-title">Change Password</h2>

    <label for="change-password-new">New Password</label>
    <input type="password" id="change-password-new" name="password" class="password-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="new-password" />

    <div class="spacer"></div>

    <label for="change-password-confirm">Confirm New Password</label>
    <div class="password-field">
      <input type="password" id="change-password-confirm" name="confirm-password" class="password-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="new-password" />
      <button type="button" class="eye-toggle" aria-label="Show password" onclick="togglePasswordVisibility('change-password-form')">
        <svg aria-hidden="true"><use href="#icon-eye-off"></use></svg>
      </button>
    </div>

    <div class="meter idle">
      <div class="meter-track"><div class="meter-fill"></div></div>
      <span class="meter-label">Strength</span>
    </div>

    <p id="change-password-message" class="message" role="alert"></p>
    <button type="button" id="change-password-button" class="btn btn-primary" onclick="handleChangePassword()">Change</button>
  </form>
</section>
